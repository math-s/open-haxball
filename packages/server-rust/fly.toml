# fly.toml app configuration file generated for open-haxball on 2026-02-01T13:27:14-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'open-haxball'
primary_region = 'iad'

[build]

[env]
  PORT = '3001'

[[services]]
  protocol = "tcp"
  internal_port = 3001
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

    [services.ports.http_options]
      h2_backend = false

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

    [services.ports.http_options]
      h2_backend = false

  [[services.http_checks]]
    interval = "15s"
    timeout = "10s"
    grace_period = "30s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
