[package]
name = "haxball-server"
version = "1.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hyper = { version = "1.5", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio"] }
hyper-tungstenite = "0.15"
http-body-util = "0.1"

[dev-dependencies]
approx = "0.5"
tokio-test = "0.4"
